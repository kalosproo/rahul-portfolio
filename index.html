<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rahul Muttukuru — Product & Systems Builder</title>
    <meta name="description" content="Rahul Muttukuru (Bujji) — product and systems builder. Not building apps. Building solutions." />
    <link rel="canonical" href="https://muttukururahul.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0B0B0A; height: 100%; }
  #root { min-height: 100vh; }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const oldBio = "I'm Rahul — everyone calls me Bujji. Second-year ECE student who ships full products solo, runs a 16-event technical chapter, and picks up gig shifts between semesters. Everything here is real, live, and built end to end.";
        const newBio = "I'm Rahul — I turn real-world problems into products. I build, experiment, and ship end to end, turning ideas into things people can actually use.";
        const replaceBio = () => {
          document.querySelectorAll("#root *").forEach((el) => {
            if (el.children.length === 0 && el.textContent.trim() === oldBio) {
              el.textContent = newBio;
            }
          });
        };
        new MutationObserver(replaceBio).observe(document.getElementById("root"), { childList: true, subtree: true });
        replaceBio();
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
